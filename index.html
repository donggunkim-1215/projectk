<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ProjectK</title>
  <style>
    @font-face {
      font-family: 'DNFForgedBlade';
      src: url('assets/fonts/DNFForgedBlade-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'DNFForgedBlade';
      src: url('assets/fonts/DNFForgedBlade-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'DNFForgedBlade';
      src: url('assets/fonts/DNFForgedBlade-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    /* 새 메인 폰트 — BMJUA (배민주아체) */
    @font-face {
      font-family: 'BMJUA';
      src: url('assets/fonts/BMJUA.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      /* 모바일 브라우저 주소창 영향 제거 — 우선순위: dvh > -webkit-fill-available > vh */
      height: 100vh;
      height: -webkit-fill-available;
      height: 100dvh;
      overflow: hidden;
      background: #1f2d12;
      font-family: 'BMJUA', sans-serif;
      position: fixed;
      top: 0;
      left: 0;
      overscroll-behavior: none;
    }
    /* 폰트가 게임 시작 전 메모리에 올라오도록 숨김 프리로더 */
    #font-preload {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
      font-family: 'BMJUA';
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game {
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      display: block;
      margin: 0 auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="font-preload">
    <span style="font-family: 'BMJUA'">A</span>
    <span style="font-family: 'DNFForgedBlade'; font-weight: 300">A</span>
    <span style="font-family: 'DNFForgedBlade'; font-weight: 500">A</span>
    <span style="font-family: 'DNFForgedBlade'; font-weight: 700">A</span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.85.2/dist/phaser.min.js"></script>
  <script>
    // Phaser는 캔버스에 텍스트를 한 번 그리면 그때의 폰트로 캐시 — 폰트가 늦게 로드되면
    // 기본 폰트로 그려진다. document.fonts.ready로 모든 @font-face 로딩을 대기한 뒤 게임 시작.
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
      .then(() => { const s = document.createElement('script'); s.src = 'game.js?v=' + Date.now(); document.body.appendChild(s); });
  </script>
</body>
</html>
